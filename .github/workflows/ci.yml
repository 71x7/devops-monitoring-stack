name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose
        run: docker compose --env-file .env.example config -q

      - name: Validar configuración y alertas de Prometheus
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml

      - name: Validar Alertmanager
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml

      - name: Validar dashboard de Grafana
        run: python3 -m json.tool grafana/dashboards/overview.json > /dev/null

      - name: yamllint
        run: |
          pip install yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable, truthy: disable}}" .
